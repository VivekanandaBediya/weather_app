<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="css/main.css">
  <!-- <script src="js/main.js" defer></script> -->
</head>
<body>

  <!-- 🔝 Header -->
  <header class="top-bar">
    <h1 class="logo">🌤 Weather App</h1>

    <form class="search-form">
      <input type="text" id="city" placeholder="Enter city name" required>
      <input type="text" id="state" placeholder="Enter state Code" required>
      <input type="text" id="country" placeholder="Enter country code" required>
      <button type="button" onclick="fetchData()">Search</button>
    </form>
  </header>

  <!-- 🌦 Center Weather Card -->
  <main class="main">
    <div class="weather-card">
      <h2 class="location">New Delhi, IN</h2>

      <div class="main-temp">
        <span class="temp" id="temp">11°C</span>
        <span class="desc" id="weather_desc">Clear Sky</span>
        <span class="feels" id="feels_like">Feels like 19°C</span>
      </div>

      <div class="weather-details">
        <div class="detail">
          <span class="label">💨 Wind</span>
          <span class="value" id="wind_speed">4 km/h</span>
        </div>

        <div class="detail">
          <span class="label">💧 Humidity</span>
          <span class="value" id="humidity">62%</span>
        </div>

        <div class="detail">
          <span class="label">🌬 Pressure</span>
          <span class="value" id="pressure">1017 hPa</span>
        </div>
      </div>
  </main>

  <script src="js/rough.js"></script>
</body>
</html>
