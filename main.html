<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
  <!-- <script src="js/main.js" defer></script> -->
</head>
<body onload="getWeather()">

  <!-- 🔝 Header -->
  <header class="top-bar">
    <h1 class="logo"><span id="sun_logo">🌤</span> Weather App</h1>

    <form class="search-form">
      <input type="text" id="city" placeholder="Enter city name" required>
      <input type="text" id="state" placeholder="Enter state Code" required>
      <input type="text" id="country" placeholder="Enter country code" required>
      <button type="button" onclick="fetchData()">Search</button>
    </form>
  </header>

  <!-- 🌦 Center Weather Card -->
  <main class="main">
    <div class="weather-card">
      <h2 class="location" id="location"></h2>

      <div class="main-temp">
        <span class="temp" id="temp"></span>
        <span class="desc" id="weather_desc"></span>
        <span class="feels" id="feels_like"></span>
      </div>

      <div class="weather-details">
        <div class="detail">
          <span class="label">💨 Wind</span>
          <span class="value" id="wind_speed"></span>
        </div>

        <div class="detail">
          <span class="label">💧 Humidity</span>
          <span class="value" id="humidity"></span>
        </div>

        <div class="detail">
          <span class="label">🌬 Pressure</span>
          <span class="value" id="pressure"></span>
        </div>
      </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
